<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>محمد البخيتي علي - فني مساحة وطرق</title>
    <script>
      // GitHub Pages SPA redirect trick: preserve the intended path/hash
      // and send the visitor back to the app's index.html so client-side
      // routing (hash links) can take over.
      var basePath = '/portfolio/';
      var target = basePath + (window.location.hash || '');
      window.location.replace(target);
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 3rem;">
      جارِ التحويل إلى الصفحة الرئيسية... <br />
      Redirecting to the homepage...
    </p>
  </body>
</html>
