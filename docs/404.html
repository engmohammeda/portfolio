    <script>
      // GitHub Pages has no SPA fallback: send deep links / hash routes back
      // into the built app so client-side anchors keep working.
      (function () {
        var base = '/portfolio/';
        var target = base + (window.location.hash || '');
        window.location.replace(target);
      })();
    </script>
